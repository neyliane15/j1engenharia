services:
  postgres:
    image: postgres:16-alpine
    container_name: emptra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emptra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      N8N_BASE_URL: ${N8N_BASE_URL}
      N8N_WEBHOOK_DISPATCH: ${N8N_WEBHOOK_DISPATCH}
      N8N_WEBHOOK_OUTBOUND: ${N8N_WEBHOOK_OUTBOUND}
      N8N_WEBHOOK_AWARD: ${N8N_WEBHOOK_AWARD}
      N8N_API_KEY: ${N8N_API_KEY}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
    volumes:
      # Anexos vivem em volume, não no banco nem na imagem.
      - uploads:/app/uploads
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: emptra-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  n8n:
    image: n8nio/n8n:latest
    container_name: emptra-n8n
    restart: unless-stopped
    depends_on:
      - api
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      NODE_ENV: production
      WEBHOOK_URL: ${N8N_PROTOCOL}://${N8N_HOST}:${N8N_PORT}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # Repassados para os workflows via $env
      EMPTRA_API_URL: http://api:3333
      EMPTRA_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      EMPTRA_N8N_API_KEY: ${N8N_API_KEY}
      EMPTRA_APP_URL: ${APP_URL}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "5678:5678"

volumes:
  postgres-data:
  n8n-data:
  uploads:
